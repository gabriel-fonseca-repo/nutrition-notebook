[project]
name = "nutrition-notebook"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.2.0",
    "pandas>=3.0.2",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "ruff>=0.15.12",
]

[tool.pyright]
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
reportMissingTypeStubs = "none"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.ruff.lint]
select = ["E", "F", "PL", "B", "UP", "RUF"]
